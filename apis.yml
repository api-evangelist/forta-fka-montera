aid: forta-fka-montera
name: Forta (fka Montera)
description: 'Forta Health (formerly Montera, Inc.) is a San Francisco based digital
  health company making Applied Behavior Analysis (ABA) therapy accessible to families
  of children with autism spectrum disorder. Forta connects families with board-certified
  behavior analysts (BCBAs) and registered behavior technicians (RBTs) for evidence-based
  care delivered virtually across 43 states and in-home in select cities, with active
  parent involvement, no waitlists, and Medicaid and insurance accepted. Backed by
  Insight Partners, the company raised a $55M Series A. It operates a consumer-facing
  healthcare service and does not currently publish a public developer API, SDKs, or
  documentation surface.'
